name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only — no production credentials are required
      # for lint/typecheck/unit-test/build. Real provider credentials are
      # configured separately per environment (Vercel Preview/Production).
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      STRIPE_SECRET_KEY: ci-placeholder-stripe-key
      STRIPE_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build
